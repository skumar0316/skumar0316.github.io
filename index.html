<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 3px solid #007bff;
        }
        h1 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        p {
            color: #666;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="profile-pic" src="Sachin.jpg" alt="Sachin's Profile Picture">
        
        <h1>Welcome to My Website!</h1>
        <p>Hi there! Thanks for visiting my personal page. Feel free to look around.</p>
    </div>

</body>
</html>
